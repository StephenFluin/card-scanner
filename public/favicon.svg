<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Card Scanner: a silver-bordered card framed by scan brackets. -->
  <rect width="64" height="64" rx="14" fill="#0f1115"/>
  <!-- Scan brackets -->
  <g fill="none" stroke="#ffcb3d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 20V12a3 3 0 0 1 3-3h8"/>
    <path d="M44 9h8a3 3 0 0 1 3 3v8"/>
    <path d="M55 44v8a3 3 0 0 1-3 3h-8"/>
    <path d="M20 55h-8a3 3 0 0 1-3-3v-8"/>
  </g>
  <!-- Card: silver border, coloured face, art window, info line -->
  <rect x="19" y="15" width="26" height="34" rx="3.5" fill="#c9ced8"/>
  <rect x="21.5" y="17.5" width="21" height="29" rx="2" fill="#ffcb3d"/>
  <rect x="24" y="20.5" width="16" height="11" rx="1" fill="#3d7bd9"/>
  <rect x="24" y="41" width="10" height="3" rx="1" fill="#1a1400"/>
</svg>
